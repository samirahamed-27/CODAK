<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Retro Pixel Serpent Pythabyte (Python Codemon) -->
  <rect width="120" height="120" fill="#0c1015" />
  <!-- Body -->
  <rect x="36" y="36" width="48" height="48" fill="#f4b41b" stroke="#0c1015" stroke-width="4" />
  <!-- Horns / Script antennas -->
  <rect x="28" y="20" width="12" height="20" fill="#f4b41b" stroke="#0c1015" stroke-width="4" />
  <rect x="80" y="20" width="12" height="20" fill="#f4b41b" stroke="#0c1015" stroke-width="4" />
  <rect x="28" y="16" width="12" height="8" fill="#e03c3c" />
  <rect x="80" y="16" width="12" height="8" fill="#e03c3c" />
  <!-- Pixel Eyes -->
  <rect x="44" y="48" width="8" height="12" fill="#0c1015" />
  <rect x="68" y="48" width="8" height="12" fill="#0c1015" />
  <rect x="46" y="50" width="4" height="4" fill="#eef5fc" />
  <rect x="70" y="50" width="4" height="4" fill="#eef5fc" />
  <!-- Cheeks -->
  <rect x="38" y="64" width="8" height="8" fill="#e03c3c" />
  <rect x="74" y="64" width="8" height="8" fill="#e03c3c" />
  <!-- Code Belly Symbol -->
  <rect x="52" y="66" width="16" height="4" fill="#0c1015" />
  <text x="60" y="78" font-size="10" font-family="'Press Start 2P', monospace" font-weight="900" fill="#38bdf8" text-anchor="middle">&gt;_</text>
</svg>
