  <rect x="6" y="0" width="4" height="2" fill="#526f8a" />
  <rect x="7" y="0" width="2" height="1" fill="#eef5fc" />
  <!-- Phantom Head -->
  <rect x="4" y="2" width="8" height="6" fill="#1b2632" />
