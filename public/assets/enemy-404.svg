  <rect x="3" y="8" width="10" height="5" fill="#0c1015" />
  <rect x="4" y="9" width="8" height="3" fill="#1b2632" />
  <!-- 404 Sigil pixels -->
  <rect x="5" y="10" width="1" height="2" fill="#e03c3c" />
  <rect x="7" y="10" width="2" height="2" fill="#e03c3c" />
  <rect x="10" y="10" width="1" height="2" fill="#e03c3c" />
  <!-- Ghostly Fragmented Tail / Broken Route Ends -->
  <rect x="3" y="13" width="2" height="3" fill="#526f8a" />
  <rect x="7" y="13" width="2" height="2" fill="#38bdf8" />
  <rect x="11" y="13" width="2" height="3" fill="#526f8a" />
