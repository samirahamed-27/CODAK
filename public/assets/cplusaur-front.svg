<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Cplusaur Front Sprite: C++ Armored Pixel Dino Square -->
  <!-- Plus-shaped Crest / Shield -->
  <rect x="7" y="1" width="2" height="4" fill="#38bdf8" />
  <rect x="6" y="2" width="4" height="2" fill="#38bdf8" />
  <!-- Heavy Head -->
  <rect x="3" y="4" width="10" height="5" fill="#2c3e50" />
  <rect x="4" y="5" width="8" height="3" fill="#526f8a" />
  <!-- Eyes -->
  <rect x="5" y="5" width="2" height="2" fill="#0c1015" />
  <rect x="9" y="5" width="2" height="2" fill="#0c1015" />
  <rect x="5" y="5" width="1" height="1" fill="#38bdf8" />
  <rect x="9" y="5" width="1" height="1" fill="#38bdf8" />
  <!-- Armored Carapace Body -->
  <rect x="2" y="9" width="12" height="5" fill="#1b2632" />
  <rect x="3" y="9" width="10" height="4" fill="#2c3e50" />
  <!-- Shell studs -->
  <rect x="5" y="10" width="2" height="2" fill="#38bdf8" />
  <rect x="9" y="10" width="2" height="2" fill="#38bdf8" />
  <!-- Sturdy legs -->
  <rect x="2" y="14" width="3" height="2" fill="#526f8a" />
  <rect x="11" y="14" width="3" height="2" fill="#526f8a" />
</svg>
