<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Bug-Pyrawr: Corrupted Glitch Dragon Boss Variant -->
  <!-- Glitch Bug Antennae & Horns -->
  <rect x="1" y="0" width="1" height="2" fill="#ff1744" />
  <rect x="2" y="1" width="1" height="2" fill="#e03c3c" />
  <rect x="14" y="0" width="1" height="2" fill="#ff1744" />
  <rect x="13" y="1" width="1" height="2" fill="#9b51e0" />
  <rect x="4" y="0" width="2" height="3" fill="#9b51e0" />
  <rect x="10" y="0" width="2" height="3" fill="#9b51e0" />

  <!-- Corrupted Head & Crest -->
  <rect x="3" y="2" width="10" height="6" fill="#e03c3c" />
  <rect x="2" y="4" width="1" height="4" fill="#9b51e0" />
  <rect x="13" y="4" width="1" height="4" fill="#ff0055" />
  <rect x="5" y="1" width="6" height="2" fill="#d50000" />

  <!-- Menacing Glowing Insect Eye Sockets -->
  <rect x="4" y="4" width="3" height="2" fill="#150308" />
  <rect x="9" y="4" width="3" height="2" fill="#150308" />
  <rect x="4" y="4" width="2" height="2" fill="#ff0055" />
  <rect x="10" y="4" width="2" height="2" fill="#ff0055" />
  <rect x="5" y="4" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="4" width="1" height="1" fill="#ffffff" />

  <!-- Jagged Bug Mandibles & Glitch Maw -->
  <rect x="2" y="6" width="2" height="2" fill="#ff1744" />
  <rect x="12" y="6" width="2" height="2" fill="#9b51e0" />
  <rect x="5" y="7" width="6" height="1" fill="#150308" />
  <rect x="6" y="7" width="4" height="1" fill="#ffffff" />

  <!-- Massive Corrupted Cyber Torso -->
  <rect x="3" y="8" width="10" height="6" fill="#35084a" />
  <rect x="4" y="9" width="8" height="4" fill="#9b51e0" />
  <rect x="6" y="9" width="4" height="4" fill="#ff1744" />
  <rect x="7" y="10" width="2" height="2" fill="#ffffff" />

  <!-- Glitch Tail & Serrated Wings -->
  <rect x="0" y="9" width="2" height="3" fill="#e03c3c" />
  <rect x="14" y="9" width="2" height="4" fill="#ff0055" />
  <rect x="13" y="12" width="2" height="2" fill="#9b51e0" />

  <!-- Armored Pincer Feet -->
  <rect x="2" y="14" width="4" height="2" fill="#e03c3c" />
  <rect x="1" y="15" width="2" height="1" fill="#150308" />
  <rect x="10" y="14" width="4" height="2" fill="#9b51e0" />
  <rect x="13" y="15" width="2" height="1" fill="#150308" />
</svg>
