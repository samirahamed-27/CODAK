<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Bug-Pyrawr Front Sprite: Red/Purple Glitch Variant -->
  <!-- Corrupted Spikes -->
  <rect x="2" y="0" width="2" height="4" fill="#e03c3c" />
  <rect x="12" y="0" width="2" height="4" fill="#9b51e0" />
  <!-- Glitch Head -->
  <rect x="4" y="3" width="8" height="6" fill="#e03c3c" />
  <rect x="3" y="5" width="2" height="2" fill="#9b51e0" />
  <rect x="11" y="4" width="2" height="3" fill="#e03c3c" />
  <!-- Menacing Eyes -->
  <rect x="5" y="4" width="2" height="2" fill="#ff0055" />
  <rect x="9" y="4" width="2" height="2" fill="#ff0055" />
  <rect x="5" y="4" width="1" height="1" fill="#ffffff" />
  <rect x="9" y="4" width="1" height="1" fill="#ffffff" />
  <!-- Glitch Maw -->
  <rect x="6" y="7" width="4" height="1" fill="#0c1015" />
  <rect x="7" y="7" width="2" height="1" fill="#eef5fc" />
  <!-- Corrupted Cyber Body -->
  <rect x="3" y="9" width="10" height="5" fill="#4a154b" />
  <rect x="5" y="10" width="6" height="4" fill="#9b51e0" />
  <!-- Clawed Glitch Feet -->
  <rect x="2" y="14" width="4" height="2" fill="#e03c3c" />
  <rect x="10" y="14" width="4" height="2" fill="#9b51e0" />
  <!-- Glitch tail token -->
  <rect x="13" y="10" width="3" height="3" fill="#ff0055" />
</svg>
