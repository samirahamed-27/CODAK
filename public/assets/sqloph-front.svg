<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Sqloph Front Sprite: SQL Relational Database Titan -->
  <!-- Layered Schema Table Top Plates -->
  <rect x="4" y="1" width="8" height="2" fill="#38bdf8" />
  <rect x="5" y="0" width="6" height="1" fill="#eef5fc" />
  <!-- Head & Relational Lens -->
  <rect x="3" y="3" width="10" height="6" fill="#1e40af" />
  <rect x="4" y="4" width="8" height="4" fill="#38bdf8" />
  <!-- Monolithic Query Visor -->
  <rect x="5" y="5" width="6" height="2" fill="#0c1015" />
  <rect x="6" y="5" width="4" height="2" fill="#f4b41b" />
  <rect x="7" y="5" width="2" height="1" fill="#eef5fc" />
  <!-- Primary Key Badge -->
  <rect x="7" y="7" width="2" height="2" fill="#f4b41b" />
  <!-- Layered Database Table Body (Columns & Rows) -->
  <rect x="2" y="9" width="12" height="5" fill="#1b2632" />
  <rect x="3" y="9" width="10" height="4" fill="#1e40af" />
  <!-- Column Grid Dividers -->
  <rect x="5" y="10" width="2" height="2" fill="#38bdf8" />
  <rect x="9" y="10" width="2" height="2" fill="#38bdf8" />
  <!-- Columnar Base Pillars -->
  <rect x="2" y="14" width="4" height="2" fill="#1b2632" />
  <rect x="10" y="14" width="4" height="2" fill="#1b2632" />
</svg>
