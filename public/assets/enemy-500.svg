<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Error 500 Front Sprite: Molten Internal Server Meltdown Golem -->
  <!-- Exhaust Steam & Server Flames -->
  <rect x="4" y="0" width="2" height="2" fill="#e03c3c" />
  <rect x="10" y="0" width="2" height="2" fill="#f4b41b" />
  <rect x="5" y="1" width="6" height="2" fill="#941e1e" />
  <!-- Overheated Server Head -->
  <rect x="3" y="3" width="10" height="6" fill="#1b2632" />
  <rect x="4" y="4" width="8" height="4" fill="#2c3e50" />
  <!-- Flashing Alarm Visor -->
  <rect x="5" y="5" width="6" height="2" fill="#e03c3c" />
  <rect x="7" y="5" width="2" height="2" fill="#f4b41b" />
  <rect x="7" y="5" width="1" height="1" fill="#eef5fc" />
  <!-- Blinking Warning LEDs -->
  <rect x="4" y="7" width="2" height="1" fill="#e03c3c" />
  <rect x="10" y="7" width="2" height="1" fill="#e03c3c" />
  <!-- Rack Meltdown Core Body -->
  <rect x="2" y="9" width="12" height="5" fill="#0c1015" />
  <rect x="3" y="9" width="10" height="4" fill="#941e1e" />
  <!-- Molten Heat Core -->
  <rect x="6" y="10" width="4" height="3" fill="#f4b41b" />
  <rect x="7" y="11" width="2" height="1" fill="#eef5fc" />
  <!-- Armored Server Struts -->
  <rect x="2" y="14" width="4" height="2" fill="#1b2632" />
  <rect x="10" y="14" width="4" height="2" fill="#1b2632" />
</svg>
