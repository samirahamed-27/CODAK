  <rect x="14" y="0" width="2" height="3" fill="#c62828" />
  <rect x="3" y="0" width="10" height="2" fill="#6a1b9a" />
  <rect x="6" y="0" width="4" height="1" fill="#ff5252" />

  <!-- Armored Glitch Carapace Head -->
  <rect x="2" y="2" width="12" height="7" fill="#1a0033" />
  <rect x="3" y="3" width="10" height="5" fill="#311b92" />
  <rect x="4" y="2" width="8" height="2" fill="#6a1b9a" />

  <!-- Crimson Optic Sensors -->
  <rect x="3" y="4" width="4" height="3" fill="#150308" />
  <rect x="9" y="4" width="4" height="3" fill="#150308" />
  <rect x="4" y="4" width="3" height="2" fill="#ff1744" />
  <rect x="9" y="4" width="3" height="2" fill="#ff1744" />
