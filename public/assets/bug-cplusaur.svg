  <rect x="4" y="8" width="8" height="4" fill="#6a1b9a" />
  <rect x="6" y="8" width="4" height="4" fill="#ff1744" />
  <rect x="7" y="9" width="2" height="2" fill="#ffffff" />

  <!-- Heavy Armored Stomping Claws -->
  <rect x="1" y="13" width="4" height="3" fill="#6a1b9a" />
