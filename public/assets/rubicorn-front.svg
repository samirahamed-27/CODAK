<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Rubicorn Front Sprite: Ruby Crystal Beast -->
  <!-- Gleaming Ruby Gem Horn -->
  <rect x="7" y="0" width="2" height="4" fill="#e03c3c" />
  <rect x="7" y="1" width="1" height="2" fill="#eef5fc" />
  <!-- Head & Ears -->
  <rect x="4" y="2" width="2" height="2" fill="#941e1e" />
  <rect x="10" y="2" width="2" height="2" fill="#941e1e" />
  <rect x="4" y="4" width="8" height="5" fill="#e03c3c" />
  <rect x="5" y="5" width="6" height="3" fill="#eef5fc" />
  <!-- Ruby Eyes -->
  <rect x="5" y="5" width="2" height="2" fill="#0c1015" />
  <rect x="9" y="5" width="2" height="2" fill="#0c1015" />
  <rect x="6" y="5" width="1" height="1" fill="#e03c3c" />
  <rect x="10" y="5" width="1" height="1" fill="#e03c3c" />
  <!-- Elegant Snout -->
  <rect x="6" y="7" width="4" height="2" fill="#941e1e" />
  <!-- Crystal Body -->
  <rect x="3" y="9" width="10" height="5" fill="#941e1e" />
  <rect x="4" y="9" width="8" height="4" fill="#e03c3c" />
  <!-- Faceted Ruby Chest Gem -->
  <rect x="7" y="10" width="2" height="2" fill="#f4b41b" />
  <rect x="7" y="10" width="1" height="1" fill="#eef5fc" />
  <!-- Hooves / Paws -->
  <rect x="3" y="14" width="3" height="2" fill="#0c1015" />
  <rect x="10" y="14" width="3" height="2" fill="#0c1015" />
  <rect x="4" y="14" width="1" height="1" fill="#f4b41b" />
  <rect x="11" y="14" width="1" height="1" fill="#f4b41b" />
</svg>
