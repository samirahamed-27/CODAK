<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Bug-Javagron Bugmon Glitch Variant -->
  <!-- Corrupted Glitch Horns -->
  <rect x="4" y="0" width="3" height="3" fill="#ea80fc" />
  <rect x="9" y="0" width="3" height="3" fill="#ea80fc" />
  <rect x="5" y="1" width="1" height="1" fill="#ff0055" />
  <rect x="10" y="1" width="1" height="1" fill="#ff0055" />
  <!-- Menacing Glitch Head -->
  <rect x="3" y="3" width="10" height="6" fill="#2a040d" />
  <rect x="4" y="4" width="8" height="4" fill="#540d1a" />
  <!-- Glowing Crimson Glitch Eyes -->
  <rect x="4" y="5" width="3" height="2" fill="#ff1744" />
  <rect x="9" y="5" width="3" height="2" fill="#ff1744" />
  <rect x="5" y="5" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="5" width="1" height="1" fill="#ffffff" />
  <!-- Snout / Fangs -->
  <rect x="5" y="7" width="6" height="2" fill="#9b51e0" />
  <rect x="6" y="8" width="1" height="2" fill="#ffffff" />
  <rect x="9" y="8" width="1" height="2" fill="#ffffff" />
  <!-- Corrupted Torso -->
  <rect x="2" y="9" width="12" height="5" fill="#150308" />
  <rect x="3" y="9" width="10" height="4" fill="#540d1a" />
  <!-- Corrupted Core with Void Cracks -->
  <rect x="6" y="10" width="4" height="3" fill="#ff0055" />
  <rect x="7" y="11" width="2" height="1" fill="#ea80fc" />
  <!-- Clawed Glitch Legs -->
  <rect x="2" y="14" width="4" height="2" fill="#9b51e0" />
  <rect x="10" y="14" width="4" height="2" fill="#9b51e0" />
</svg>
