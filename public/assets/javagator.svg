<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="waterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gatorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#waterGlow)" />
  <!-- Monster Body -->
  <rect x="34" y="38" width="52" height="46" rx="16" fill="url(#gatorGrad)" stroke="#064E3B" stroke-width="3" />
  <!-- Spikes on Head -->
  <polygon points="44,38 48,26 52,38" fill="#F59E0B" stroke="#064E3B" stroke-width="2" />
  <polygon points="58,38 62,24 66,38" fill="#F59E0B" stroke="#064E3B" stroke-width="2" />
  <polygon points="72,38 76,26 80,38" fill="#F59E0B" stroke="#064E3B" stroke-width="2" />
  <!-- Eyes -->
  <circle cx="48" cy="50" r="7" fill="#FEF08A" stroke="#064E3B" stroke-width="2" />
  <circle cx="72" cy="50" r="7" fill="#FEF08A" stroke="#064E3B" stroke-width="2" />
  <rect x="47" y="47" width="2" height="6" rx="1" fill="#0F172A" />
  <rect x="71" y="47" width="2" height="6" rx="1" fill="#0F172A" />
  <!-- Snout / Jaws -->
  <rect x="42" y="62" width="36" height="18" rx="8" fill="#34D399" stroke="#064E3B" stroke-width="2.5" />
  <!-- Teeth -->
  <polygon points="48,62 51,68 54,62" fill="#FFFFFF" />
  <polygon points="66,62 69,68 72,62" fill="#FFFFFF" />
  <!-- Java Cup Steam on Snout -->
  <path d="M 57 70 Q 60 76 63 70" stroke="#065F46" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Coffee Bean Emblem -->
  <ellipse cx="60" cy="74" rx="3.5" ry="2" fill="#92400E" />
</svg>
