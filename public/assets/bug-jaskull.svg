<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Bug-Jaskull: Corrupted Glitch Skull Boss Variant -->
  <!-- Glitch Antennas & Spectral Tendrils -->
  <rect x="0" y="0" width="1" height="3" fill="#ff1744" />
  <rect x="1" y="1" width="1" height="2" fill="#d50000" />
  <rect x="15" y="0" width="1" height="3" fill="#ff1744" />
  <rect x="14" y="1" width="1" height="2" fill="#8a2be2" />
  <rect x="3" y="0" width="2" height="2" fill="#8a2be2" />
  <rect x="11" y="0" width="2" height="2" fill="#8a2be2" />

  <!-- Massive Corrupted Skull Dome -->
  <rect x="3" y="2" width="10" height="7" fill="#8a2be2" />
  <rect x="4" y="1" width="8" height="2" fill="#d50000" />
  <rect x="2" y="3" width="12" height="6" fill="#260033" />
  <rect x="3" y="3" width="10" height="5" fill="#4a148c" />

  <!-- Flaming Glitch Eye Sockets -->
  <rect x="3" y="4" width="4" height="4" fill="#150308" />
  <rect x="9" y="4" width="4" height="4" fill="#150308" />
  <rect x="4" y="5" width="3" height="3" fill="#ff0055" />
  <rect x="9" y="5" width="3" height="3" fill="#ff0055" />
  <rect x="5" y="5" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="5" width="1" height="1" fill="#ffffff" />

  <!-- Spider Bug Mandibles & Splayed Side Legs -->
  <rect x="0" y="5" width="2" height="2" fill="#ff1744" />
  <rect x="14" y="5" width="2" height="2" fill="#8a2be2" />
  <rect x="1" y="8" width="1" height="3" fill="#d50000" />
  <rect x="14" y="8" width="1" height="3" fill="#8a2be2" />

  <!-- Terrifying Skull Teeth & Core -->
  <rect x="5" y="9" width="6" height="3" fill="#d50000" />
  <rect x="5" y="10" width="6" height="2" fill="#ffffff" />
  <rect x="6" y="10" width="1" height="2" fill="#150308" />
  <rect x="8" y="10" width="1" height="2" fill="#150308" />
  <rect x="10" y="10" width="1" height="2" fill="#150308" />

  <!-- Haunting Glitch Plasma Trails -->
  <rect x="3" y="12" width="2" height="4" fill="#8a2be2" />
  <rect x="6" y="13" width="4" height="2" fill="#ff0055" />
  <rect x="7" y="12" width="2" height="2" fill="#d50000" />
  <rect x="11" y="12" width="2" height="4" fill="#8a2be2" />
</svg>
