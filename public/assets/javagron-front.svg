<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Javagron Front Sprite: Java Enterprise Golem / Dragon -->
  <!-- Coffee Bean Spikes / Steam Horns -->
  <rect x="5" y="1" width="2" height="3" fill="#f4b41b" />
  <rect x="9" y="1" width="2" height="3" fill="#f4b41b" />
  <rect x="6" y="0" width="1" height="1" fill="#eef5fc" />
  <rect x="10" y="0" width="1" height="1" fill="#eef5fc" />
  <!-- Sturdy Head -->
  <rect x="4" y="3" width="8" height="6" fill="#9f7209" />
  <rect x="5" y="4" width="6" height="4" fill="#f4b41b" />
  <!-- Eyes -->
  <rect x="5" y="5" width="2" height="2" fill="#0c1015" />
  <rect x="9" y="5" width="2" height="2" fill="#0c1015" />
  <rect x="5" y="5" width="1" height="1" fill="#eef5fc" />
  <rect x="9" y="5" width="1" height="1" fill="#eef5fc" />
  <!-- Jaws / Snout -->
  <rect x="6" y="7" width="4" height="2" fill="#e03c3c" />
  <rect x="7" y="7" width="2" height="1" fill="#941e1e" />
  <!-- Enterprise JVM Armored Torso -->
  <rect x="3" y="9" width="10" height="5" fill="#9f7209" />
  <rect x="4" y="9" width="8" height="4" fill="#f4b41b" />
  <!-- Coffee Cup Core Emblem -->
  <rect x="6" y="10" width="4" height="3" fill="#e03c3c" />
  <rect x="7" y="11" width="2" height="1" fill="#eef5fc" />
  <!-- Heavy Pillar Legs -->
  <rect x="3" y="14" width="3" height="2" fill="#0c1015" />
  <rect x="10" y="14" width="3" height="2" fill="#0c1015" />
</svg>
